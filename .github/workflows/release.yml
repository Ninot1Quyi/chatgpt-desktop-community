name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package version
        run: node _analysis/check-release-tag.mjs

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            artifact: release-win32-x64
          - os: macos-14
            target: darwin-universal
            artifact: release-darwin-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run package -- --target=${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - run: node _analysis/bundle-selection-check.mjs --target=${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/${{ matrix.target }}/*.exe
            release/${{ matrix.target }}/*.dmg
            release/${{ matrix.target }}/*.zip
            release/${{ matrix.target }}/*.blockmap
            release/${{ matrix.target }}/*.yml
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**
