# Build the Windows NSIS installer and publish it to GitHub Releases.
# Trigger by pushing a version tag, e.g.:
#   npm version patch -m "release v%s"
#   git push --follow-tags
# The tag version must match package.json "version" — electron-updater
# compares the installed version against latest.yml on the release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: node scripts/prepare-codex-runtime.mjs win32-x64

      # Pre-create one draft so electron-builder's parallel asset uploads all
      # target the same release. Publishing happens only after every upload.
      - name: Create draft release
        run: gh release create "$env:GITHUB_REF_NAME" --draft --verify-tag --title "$env:GITHUB_REF_NAME" --notes "Windows installer and auto-update metadata." --repo "$env:GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure release is public
        run: gh release edit "$env:GITHUB_REF_NAME" --draft=false --repo "$env:GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
