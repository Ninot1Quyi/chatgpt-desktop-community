name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify tag matches package version
        run: node _analysis/check-release-tag.mjs
      - name: Resolve latest stable Codex CLI
        run: node scripts/resolve-codex-release.mjs --output=release/codex-release-manifest.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: codex-release-manifest
          path: release/codex-release-manifest.json
          if-no-files-found: error

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            artifact: release-win32-x64
          - os: macos-14
            target: darwin-universal
            artifact: release-darwin-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - uses: actions/download-artifact@v4
        with:
          name: codex-release-manifest
          path: release
      - name: Prepare macOS signing credentials
        if: matrix.target == 'darwin-universal'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/prepare-macos-signing.mjs
      - run: npm run package -- --target=${{ matrix.target }}
        env:
          CODEX_RELEASE_MANIFEST_PATH: release/codex-release-manifest.json

      - run: node _analysis/bundle-selection-check.mjs --target=${{ matrix.target }}

      - name: Verify macOS signature and notarization
        if: matrix.target == 'darwin-universal'
        run: node scripts/verify-macos-release.mjs --target=darwin-universal

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/${{ matrix.target }}/*.exe
            release/${{ matrix.target }}/*.dmg
            release/${{ matrix.target }}/*.zip
            release/${{ matrix.target }}/*.blockmap
            release/${{ matrix.target }}/*.yml
          if-no-files-found: error

      - name: Remove macOS signing material
        if: always() && matrix.target == 'darwin-universal'
        run: >-
          node -e "require('node:fs').rmSync(require('node:path').join(process.env.RUNNER_TEMP, 'macos-signing'), { recursive: true, force: true })"

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**
