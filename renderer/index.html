<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: codex-file:; connect-src 'self' ws: codex-file:; font-src 'self' data:; media-src 'self' blob: codex-file:"
    />
    <title>ChatGPT Desktop Community</title>
  </head>
  <body>
    <div id="root">
      <div
        style="display:flex;height:100vh;align-items:center;justify-content:center;background:#181a1f;color:#aeb4c0;font:14px system-ui,sans-serif"
      >
        Starting ChatGPT Desktop Community…
      </div>
    </div>
    <script>
      (() => {
        const timer = setTimeout(() => {
          if (window.__COMMUNITY_RENDERER_MOUNTED__) return;
          window.codexBridge?.diagnosticsReport({
            level: "error",
            event: "renderer_boot_timeout",
            context: { path: window.location.pathname },
          });
          const root = document.getElementById("root");
          if (!root) return;
          root.innerHTML = [
            '<div style="box-sizing:border-box;display:flex;height:100vh;align-items:center;justify-content:center;background:#181a1f;color:#f2f4f8;font:14px system-ui,sans-serif;padding:24px">',
            '<div style="max-width:560px;text-align:center"><h1 style="font-size:20px">The interface did not start</h1>',
            '<p style="color:#aeb4c0;line-height:1.6">A diagnostic log was written. Open the logs folder and send main.log when reporting this problem.</p>',
            '<button id="open-diagnostic-logs" style="border:1px solid #4a4f5c;border-radius:8px;background:#272a31;color:#fff;padding:8px 14px;cursor:pointer">Open logs folder</button>',
            "</div></div>",
          ].join("");
          document.getElementById("open-diagnostic-logs")?.addEventListener("click", () => {
            window.codexBridge?.diagnosticsOpenLogs();
          });
        }, 12000);
        window.addEventListener("community:renderer-mounted", () => clearTimeout(timer), { once: true });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
